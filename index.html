<style>

.row{display:flex;gap:5px}
.ok{outline:4px solid #22d36b}.bad{outline:4px solid #ff4b4b}
s{opacity:.55}

#f{background:linear-gradient(180deg,color-mix(in srgb,var(--fb) 70%,#fff),var(--fb) 45%,color-mix(in srgb,var(--fb) 45%,#000))}
#ar{top:138px}#o{z-index:999;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:scale(.94)}}
#sc{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sc i{position:absolute;font-style:normal;opacity:.22;font-size:34px;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px) rotate(8deg)}}
.av{animation:bob 2.4s ease-in-out infinite;z-index:3}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ลูกเต๋า */
.die{animation:pop .3s}
.die.r{animation:tum .25s ease-in-out infinite}
.die.flash{animation:df .35s ease-out}
@keyframes pop{from{transform:scale(.4) rotate(-90deg);opacity:0}}
@keyframes tum{
  0% { transform: rotate(0deg) translateY(0) scale(1); }
  25% { transform: rotate(90deg) translateY(-15px) scale(1.1); }
  50% { transform: rotate(180deg) translateY(-25px) scale(1.2); }
  75% { transform: rotate(270deg) translateY(-15px) scale(1.1); }
  100% { transform: rotate(360deg) translateY(0) scale(1); }
}
@keyframes df{
  0% { transform: scale(1.4); filter: brightness(2) drop-shadow(0 0 12px #fff); }
  100% { transform: scale(1); filter: brightness(1); }
}

.lb{animation:lb .45s}@keyframes lb{40%{transform:translate(20px,130px) scale(1.25)}}
.lp{animation:lp .45s}@keyframes lp{40%{transform:translate(-20px,-170px) scale(1.25)}}
.hit{animation:ht .5s}@keyframes ht{20%{transform:translateX(-12px);filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(6)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}}
#f.shake{animation:sk .35s}@keyframes sk{25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-3px)}}
.slash{position:absolute;width:150px;height:6px;background:#fff;box-shadow:0 0 14px 4px #fff;border-radius:4px;transform:rotate(-35deg);animation:sl .35s forwards;z-index:5;pointer-events:none}
@keyframes sl{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0);opacity:0}}
.dn{position:absolute;font-size:30px;font-weight:700;color:#ffdd44;text-shadow:0 2px 0 #000,0 0 8px #000;animation:up 1.1s forwards;z-index:6;pointer-events:none}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#bn{position:absolute;left:0;right:0;top:44%;z-index:20;text-align:center;font-weight:700;font-size:24px;padding:10px;transform:translateX(-120%);pointer-events:none;color:#fff;background:linear-gradient(90deg,#0000,#c0120ccc 20%,#c0120ccc 80%,#0000);text-shadow:0 2px 4px #000}
#bn.g{background:linear-gradient(90deg,#0000,#1a9a4bcc 20%,#1a9a4bcc 80%,#0000)}
#bn.b{background:linear-gradient(90deg,#0000,#1a6fc9cc 20%,#1a6fc9cc 80%,#0000)}
#bn.go{animation:bn 1.5s ease-out}
@keyframes bn{0%{transform:translateX(-120%)}20%,75%{transform:translateX(0)}100%{transform:translateX(120%)}}
#sub{position:absolute;top:86px;left:8px;right:8px;z-index:8;background:#000a;border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.35;min-height:2.7em;opacity:0;transition:opacity .3s;pointer-events:none}
#sub.on{opacity:1}#sub b{color:#ffd45e}
.logo{font-size:30px;text-align:center;font-weight:700;text-shadow:0 0 18px #7be;animation:bob 2.4s ease-in-out infinite}

/* การกดปุ่ม */
.btn{transition:transform .1s; cursor:pointer; position:relative; z-index:10; max-width: 400px; width: 100%; box-sizing: border-box;}
.btn:hover{transform:scale(1.02)}
button:active{transform:scale(.98)}

.box{animation:pop .4s}.card{animation:pop .3s backwards}

.av svg{width:100%;height:100%;overflow:visible}
#ba{top:auto;left:auto;right:9%;bottom:26%}#pa{right:auto;left:9%;bottom:26%}
#ba .pill,#pa .pill{left:50%;right:auto;bottom:-26px;transform:translateX(-50%);white-space:nowrap}
#st{width:34%;top:8px}
#sub{top:58px;left:15%;right:15%}
#ar{left:24%;right:24%;top:112px;bottom:82px;flex-direction:row-reverse}
.line{width:3px;height:auto;align-self:stretch}
#roll{transform:translateX(-110%);bottom:14px;padding:12px 26px}
#ev{left:50%;right:auto;bottom:14px;transform:translateX(10%);padding:12px 20px}
#sc svg{width:100%;height:100%;display:block}

.box{padding:10px}.box p{margin:2px 0;font-size:13px}.box h2{margin:0 0 4px}.btn{padding:9px 16px;font-size:15px}
.lp{animation:lp .45s}@keyframes lp{40%{transform:translateX(480%) scale(1.15)}}
.lb{animation:lb .45s}@keyframes lb{40%{transform:translateX(-480%) scale(1.15)}}

/* เลย์เอาต์แนวนอน */
.av{width:88px;height:88px;background:#fffd;border-radius:50%}
.av svg{padding:4px 10px;box-sizing:border-box}
#ba{top:8px;left:8px;right:auto;bottom:auto}
#pa{bottom:8px;right:8px;left:auto;top:auto}
#ba .pill{left:auto;right:-30px;bottom:0;transform:none}
#pa .pill{left:-50px;right:auto;bottom:0;transform:none}
#st{top:8px;width:34%}
#sub{top:58px;left:20%;right:20%}
#ar{left:12%;right:12%;top:108px;bottom:74px;flex-direction:column}

.half{gap:26px}

/* ถือจอแนวตั้ง */
@media(orientation:portrait){
body>#rot{display:none!important}
#g{position:fixed;top:0;left:0;width:100dvh;height:100dvw;max-width:none;aspect-ratio:auto;transform-origin:top left;transform:translateX(100dvw) rotate(90deg)}

/* เวทีแนวนอนเต็มจอ */
#g{position:fixed;top:0;left:0;width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;padding:0;border-radius:0;background:var(--fb,#2c2c4a);transform:none;display:flex;justify-content:center;align-items:center;overflow:hidden}

.card{font-size:11px}.logo{font-size:24px}
.lp{animation:lp .45s}@keyframes lp{40%{transform:translate(-230%,-280%) scale(1.15)}}
.lb{animation:lb .45s}@keyframes lb{40%{transform:translate(230%,280%) scale(1.15)}}

/* ดีไซน์ธีมกระดาษโน้ตผจญภัย (Paper/Doodle Style) */
.paper-box {
    background: #fbf5e6;
    background-image: repeating-linear-gradient(transparent, transparent 27px, #e0d4b4 28px);
    background-size: 100% 28px;
    background-position: 0 10px;
    border: 3px solid #3a2a10;
    border-radius: 4px 12px 6px 10px;
    color: #3a2a10;
    box-shadow: 6px 6px 0px rgba(58, 42, 16, 0.4);
    padding: 24px 16px;
    font-family: 'Kanit', 'Sarabun', sans-serif;
    position: relative;
    max-width: 450px;
    width: 95%;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.paper-box .paper-card, .paper-card {
    background: #ffffff !important;
    border: 2px solid #3a2a10 !important;
    border-radius: 6px 10px 6px 8px !important; 
    color: #0f172a !important;
    box-shadow: 3px 3px 0 #3a2a10 !important;
    transition: transform 0.1s, box-shadow 0.1s;
    font-size: 15px;
    font-weight: bold;
    flex: 1 1 40%;
    min-width: 120px;
    height: auto;
    padding: 10px 8px;
    cursor: pointer;
}
.paper-box .paper-card:hover, .paper-card:hover { transform: translate(-2px, -2px) !important; box-shadow: 5px 5px 0 #3a2a10 !important; background: #f8fafc !important; }
.paper-box .paper-card:active, .paper-card:active { transform: translate(2px, 2px) !important; box-shadow: 1px 1px 0 #3a2a10 !important; }
.paper-box .paper-card.ok, .paper-card.ok { background: #dcfce7 !important; border-color: #16a34a !important; box-shadow: 3px 3px 0 #16a34a !important; color: #14532d !important; outline: none !important; }
.paper-box .paper-card.bad, .paper-card.bad { background: #fee2e2 !important; border-color: #dc2626 !important; box-shadow: 3px 3px 0 #dc2626 !important; color: #7f1d1d !important; outline: none !important; }

/* อนิเมชั่นปุ่มไม้ตาย */
.ult-btn {
    background: linear-gradient(#ffea6a,#ff8a00) !important;
    color: #3a1a00 !important;
    border: 2px solid #a35a00 !important;
    text-shadow: 0 1px 2px #fff !important;
    animation: pulse-ult 0.8s infinite alternate;
}
@keyframes pulse-ult {
    to { filter: brightness(1.2) contrast(1.1); box-shadow: 0 0 20px #ffea6a, 0 4px 0 #6a0a0a; }
}
@keyframes pulse-role {
    0% { transform: translateX(-50%) scale(1); }
    100% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 14px rgba(239, 68, 68, 0.9); }
}
.role-badge {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 12px;
    white-space: nowrap;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 3px;
    line-height: 1.2;
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
}
.atk-badge {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff;
    border: 1.5px solid #fecaca;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    animation: pulse-role 0.8s infinite alternate;
}
.def-badge {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border: 1.5px solid #bfdbfe;
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
}

/* ================= UI v4.2: Arcane Tower theme ================= */

.menu{display:flex;flex-direction:column;gap:9px;align-items:stretch;max-width:440px!important;width:100%}

.logo{font-family:'Cinzel','Kanit',serif;font-weight:900;font-size:32px;letter-spacing:2px;line-height:1.05;background:linear-gradient(#fff8dc,#f3d27a 45%,#b8801e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2400) drop-shadow(0 0 16px #e8c25a55);text-shadow:none}

  root.querySelectorAll('['+I18N_ATTR.join('],[')+']').forEach(el=>I18N_ATTR.forEach(a=>{if(el.hasAttribute(a))trAttr(el,a)}));
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))trNode(n);
}
function untrTree(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const r=I18N_REC.get(n);if(r){if(n.data===r.t)n.data=r.o;I18N_REC.delete(n)}}
  root.querySelectorAll('*').forEach(el=>{const R=el.__i18n;if(!R)return;for(const a in R){if(el.getAttribute(a)===R[a].t)el.setAttribute(a,R[a].o)}el.__i18n=null});
}

const ac=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC};
function tone(f,d,ty='sine',v=.2,t0=0,f2){
  try {
    if(mute)return;
    const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
    o.type=ty;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d);
  } catch(e) {}
}
function noise(d,f,v=.3,t0=0,q=1){
  try {
    if(mute)return;
    const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
    const r=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+t0;
    r.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    r.connect(fl).connect(g).connect(a.destination);r.start(t);
  } catch(e) {}
}

async function rollTo(side,n){
  const el=$(side==='p'?'#dp':'#db');
  SFX.dice();
  for(let i=0;i<12;i++){
    el.innerHTML=dice(Array.from({length:n},d6)).replace(/class="die"/g,'class="die r"');
    await sl(70);
  }
  const r=Array.from({length:n},d6);
  el.innerHTML=dice(r).replace(/class="die"/g,'class="die flash"');
  await sl(350);
  return r;
}

let curChoices = [];
function rollItem(type) {
    const pool = WEAPON_POOLS[type];
    const base = pool[Math.floor(Math.random() * pool.length)];
    const icons = { sword: '🗡️', magic: '🔮', bow: '🏹' };
    const typeTitles = { sword: '1. ดาบ (Sword)', magic: '2. เวท (Magic)', bow: '3. ธนู (Bow)' };
    return {
        ...base,
        type,
        icon: icons[type],
        typeTitle: typeTitles[type]
    };
}

let rerollsLeft = 3;

function openWeaponSelect(floorNum=0){
    G.targetFloor = floorNum;
    selectedWpIdx = 0;
    rerollsLeft = 3;
    rollWeaponsInitial();
}

function rollWeaponsInitial(){
    const w1 = rollItem('sword');
    const w2 = rollItem('magic');
    const w3 = rollItem('bow');
    curChoices = [w1, w2, w3];
    renderWeaponSelect();
}

function rerollWeapons(){
    if(rerollsLeft <= 0) return;
    rerollsLeft--;
    SFX.dice();
    const w1 = rollItem('sword');
    const w2 = rollItem('magic');
    const w3 = rollItem('bow');
    curChoices = [w1, w2, w3];
    renderWeaponSelect();
}

async function startStage(){
    const w = curChoices[selectedWpIdx] || curChoices[0];
    if(w.type === 'sword') SFX.slash();

    await showBanner(`ติดตั้ง: ${w.icon} ${w.name}!`, 'g');
    run(G.targetFloor || 0, w);
}

function run(f=0, weapon=null){
    if(!weapon){
        openWeaponSelect(f);
        return;
    }
    G = {
        f,
        hp: 20,
        mx: DF().php(f),
        learned: new Set(),
        ult: 0,
        tCount: 1,
        weapon: weapon,
        gold: 0,
        bonusQa: 0,
        bonusQd: 0,
        bonusAtk: 0,
        bonusDmgReduce: 0,
        bonusTime: 0,
        bonusPierce: 0,
        startUlt: 0,
        revive: 0,
        bonusMx: 0
    };
    if(BANK>0){G.gold+=BANK;G.bankMsg=BANK;BANK=0;saveProgress()}
    floor();
}

async function floor(){const F=P[G.f];EP++;G.between=false;bgmPlay();$('#f').classList.remove('menu-mode');setBossBg(G.f);$('#bk').style.display='block';$('#mt').style.display='block';$('#mt').textContent=mute?'🔇':'🔊';G.bh=F.h;G.shield=0;G.dodge=0;G.stun=0;G.flip=0;G.en=Math.min(EN_MAX,DF().en0 + 2*(G.weapon?.bonusQa || 0) + 2*(G.bonusQa || 0));G.used=[];G.gain=0;G.lw=0;G.hp=G.mx;G.ult=Math.min(2,G.startUlt || 0);G.lock=true;$('#g').style.setProperty('--fb',F.c);$('#sc').innerHTML=scene(G.f);ovl(null);hud();$('#db').innerHTML=$('#dp').innerHTML='';btns(0,0);
setStatus(`ชั้น ${G.f+1}: [Lv.${F.lv}] ${F.n}`);await showBanner(`ชั้น ${G.f+1} — [Lv.${F.lv}] ${SN[G.f]}`,'b');say(F.n,LN[G.f][0]);await sl(1800);if(F.buff){await showBanner(`💀 บัฟบอส [Lv.${F.lv}]: ${F.buff.name}`,'');}if(G.bankMsg){await showBanner(`💎 คริสตัลจากลานฝึก → +${G.bankMsg} 🪙`,'g');G.bankMsg=0;}
setStatus('ทอยเต๋าชิงเริ่มก่อน');let a,b;do{b=(await rollTo('b',1))[0];a=(await rollTo('p',1))[0];if(G.weapon?.alwaysFirst && a<=b){a=Math.min(6, b+1)}if(a==b){setStatus('เสมอ! ทอยใหม่');await sl(800)}}while(a==b);G.att=a>b?'p':'b';setStatus(a>b?'คุณเริ่มก่อน!':'บอสเริ่มก่อน!');await sl(900);turn()}

function btns(r,e){$('#roll').disabled=!r;$('#ev').disabled=!e; hud();}

// ระบบมินิเกมเรียงคำศัพท์ (อีเวนต์พิเศษ)
function specialEvent() {
    return new Promise(resolve => {
        SFX.warn();
        const F = P[G.f];
        const p = F.w[Math.floor(Math.random() * F.w.length)];
        const wordPair = Math.random() > 0.5 ? [p[0], p[1]] : [p[2], p[3]];
        const word = wordPair[0].toUpperCase();
        const meaning = wordPair[1];

        // สลับตัวอักษร
        let letters = word.split('');
        for(let i=letters.length-1; i>0; i--){
            const j = Math.floor(Math.random()*(i+1));
            [letters[i], letters[j]] = [letters[j], letters[i]];
        }
        
        G.spWord = word;
        G.spAns = "";
        G.spResolve = resolve;

        const bonusSec = ((G.weapon?.bonusTime || 0) + (G.bonusTime || 0)) / 1000;
        const totalTimeSec = 10.0 + bonusSec + DF().time/1000;
        const startTime = Date.now();
        if(G.spTimerInterval) clearInterval(G.spTimerInterval);

        ovl(`<div class="paper-box" style="max-width:380px">
            <h2 style="text-align:center;margin:0;font-size:22px;color:#d32f2f;font-weight:800">✨ อีเวนต์พิเศษ! (เทิร์น ${G.tCount}) ✨</h2>
            <p style="text-align:center;margin:4px;font-size:15px;font-weight:700;color:#374151">เรียงอักษรคำนี้ให้ถูกต้องเพื่อรับโบนัสทรงพลัง!</p>
            
            <div style="margin:6px 0;background:#fbf5e6;border:1px solid #d4a373;border-radius:6px;padding:6px">
                <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold;color:#6a4e23;margin-bottom:3px">
                    <span>⏱️ เวลาที่เหลือ:</span>
                    <span id="sp-timer" style="color:#c0392b;font-size:15px;font-weight:bold">${totalTimeSec.toFixed(1)} วิ</span>
                </div>
                <div style="height:8px;background:#e2d9c8;border-radius:4px;overflow:hidden;border:1px solid #b89f80">
                    <div id="sp-tfill" style="height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#f39c12,#e74c3c);transition:width 0.1s linear"></div>
                </div>
            </div>

            <div style="font-size:18px;text-align:center;color:#111827;background:#fff;border-radius:6px;padding:6px 10px;border:2px dashed #3a2a10;font-weight:700">แปลว่า: <b class="nt" style="color:#0284c7;font-size:20px">${meaning}</b></div>
            <div id="sp-ans" style="min-height:36px;font-size:26px;text-align:center;letter-spacing:6px;border-bottom:2px dashed #3a2a10;margin:10px 8px;padding:4px;font-weight:bold;color:#1a6fc9"></div>
            <div class="row" style="flex-wrap:wrap;justify-content:center;gap:6px" id="sp-letters">
                ${letters.map((l,i) => `<button class="card paper-card" style="flex:none;min-width:44px;width:44px;height:44px;padding:0;font-size:22px" onclick="tapLetter(this, '${l}')">${l}</button>`).join('')}
            </div>
        </div>`);

        G.spTimerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, totalTimeSec - elapsed);
            const timerEl = $('#sp-timer');
            const fillEl = $('#sp-tfill');
            if(timerEl) timerEl.textContent = remaining.toFixed(1) + ' วิ';
            if(fillEl) fillEl.style.width = ((remaining / totalTimeSec) * 100) + '%';
            
            if(remaining <= 0) {
                clearInterval(G.spTimerInterval);
                if(!$('#sp-ans')){G.spTimerInterval=null;return}
                G.spTimerInterval = null;
                SFX.bad();
                ovl(`<div class="paper-box" style="max-width:380px">
                    <h2 style="text-align:center;margin:0;color:#dc3545">⏰ หมดเวลา!</h2>
                    <p style="text-align:center;margin:8px 0">คำตอบที่ถูกต้องคือ: <b style="color:#1a6fc9;font-size:18px">${G.spWord}</b></p>
                    <button class="btn paper-card" onclick="endSp()">เสียดายจัง</button>
                </div>`);
            }
        }, 100);
    });
}

function tapLetter(btn, l) {
    btn.style.visibility = 'hidden';
    G.spAns += l;
    $('#sp-ans').textContent = G.spAns;
    SFX.click();
    
    if (G.spAns.length === G.spWord.length) {
        if(G.spTimerInterval) {
            clearInterval(G.spTimerInterval);
            G.spTimerInterval = null;
        }
        if (G.spAns === G.spWord) {
            SFX.ok();
            G.gold = (G.gold || 0) + 1;
            setTimeout(()=>SFX.coin(), 350);
            ovl(`<div class="paper-box">
                <h2 style="text-align:center;margin:0;color:#28a745">✨ เรียงคำสำเร็จ! (+1 🪙) ✨</h2>
                <p style="text-align:center">เลือกรับบัฟพิเศษ</p>
                <button class="btn paper-card" style="background:#ffdddd;border-color:#dc3545;margin-bottom:8px" onclick="applySp('atk')">🗡️ โจมตีบอส 3-7 ดาเมจ</button>
                <button class="btn paper-card" style="background:#ddffdd;border-color:#28a745" onclick="applySp('def')">🛡️ ฟื้นฟู HP 3-7 หน่วย</button>
            </div>`);
        } else {
            SFX.bad();
            {const k=G.spWord[0]+G.spWord.slice(1).toLowerCase();if(WI[k]){MISS.add(k);saveProgress()}}
            ovl(`<div class="paper-box">
                <h2 style="text-align:center;margin:0;color:#dc3545">❌ ผิดพลาด!</h2>
                <p style="text-align:center">คำตอบที่ถูกคือ: <b>${G.spWord}</b></p>
                <button class="btn paper-card" onclick="endSp()">เสียดายจัง</button>
            </div>`);
        }
    }
}

async function applySp(type) {
    if(G.spTimerInterval) {
        clearInterval(G.spTimerInterval);
        G.spTimerInterval = null;
    }
    ovl(null);
    const amt = 3 + Math.floor(Math.random() * 5); // 3-7
    if (type === 'atk') {
        SFX.slash();
        $('#ba').classList.add('hit');
        $('#f').classList.add('shake');
        fx($('#ba'), '-' + amt);
        G.bh -= amt;
    } else {
        SFX.heal();
        fx($('#pa'), '+' + amt, 1);
        G.hp = Math.min(G.mx, G.hp + amt);
    }
    hud();
    await sl(1000);
    $('#ba').classList.remove('hit');
    $('#f').classList.remove('shake');
    G.spResolve();
}

function endSp() {
    if(G.spTimerInterval) {
        clearInterval(G.spTimerInterval);
        G.spTimerInterval = null;
    }
    ovl(null);
    G.spResolve();
}

// ลูปเทิร์นหลัก
async function turn(){
    G.sk=false;G.mod={};G.lock=false;
    const ap=G.att==='p';
    
    // พลังคัมภีร์เวทศักดิ์สิทธิ์: ฟื้นฟู HP ทุกเริ่มเทิร์น
    if(G.weapon?.turnHeal && G.hp < G.mx){
        const healAmt = Math.min(G.weapon.turnHeal, G.mx - G.hp);
        G.hp += healAmt;
        fx($('#pa'), '+' + healAmt + ' HP', 1);
        SFX.heal();
    }

    hud();

    // ตัวจุดชนวนอีเวนต์พิเศษ: ถ้าผ่านไป 12 เทิร์น (เข้าสู่เทิร์นที่ 13, 25, 37...) จะแสดงมินิเกม
    if (G.tCount > 1 && G.tCount % 12 === 1 && !G.spDone) {
        G.spDone = true; 
        await specialEvent();
        if(G.bh<=0) return win();
        if(G.hp<=0) return lose();
        hud();
    }
    // 👹 สกิลบอสชั้น 2–6 (ร่ายตามรอบเทิร์นของบอสแต่ละตัว)
    const spId = P[G.f]?.buff?.id;
    if (BOSS_SPELLS[spId] && G.tCount % spellEvery(spId) === 0 && !G.fcDone) {
        G.fcDone = true;
        if(spId==='king'&&G.bh<=P[G.f].h/2&&G.kingP2EP!==EP){G.kingP2EP=EP;await showBanner('🌀 เฟส 2: โลกกลับด้าน!');say(P[G.f].n,'เวทของเหล่าขุนพลทุกชั้น จงกลับมารวมกันที่บัลลังก์ของข้า!',3000);await sl(900)}
        await bossSpell(spId==='king'?kingPick():spId);
        if(G.bh<=0) return win();
        if(G.hp<=0) return lose();
        G.lock=false; hud();
    }
    
    setStatus(ap ? '⚔️ เทิร์นคุณ: โจมตี!' : '🛡️ เทิร์นบอส: คุณป้องกัน!');
    if(ap) {
        $('#st').style.background = 'linear-gradient(#3f1218, #180507)';
        $('#st').style.borderColor = '#ef4444';
        $('#st').style.boxShadow = '0 0 12px rgba(239, 68, 68, 0.6)';
        $('#st').style.color = '#fecaca';
    } else {
        $('#st').style.background = 'linear-gradient(#0e2040, #061024)';
        $('#st').style.borderColor = '#3b82f6';
        $('#st').style.boxShadow = '0 0 12px rgba(59, 130, 246, 0.6)';
        $('#st').style.color = '#bfdbfe';
    }
    $('#db').innerHTML=$('#dp').innerHTML='';btns(1,G.en>=skCost(ap?'a':'d'));
    if(ap)showBanner('YOUR TURN — โจมตี!','g');else{SFX.warn();showBanner('WARNING — บอสโจมตี!')}
    if(G.hp<=6&&!G.lw){G.lw=1;setTimeout(()=>{SFX.warn();showBanner('HP ต่ำ!')},1700)}
}

// ===== 💾 ระบบเซฟ / โหลด (เข้าเกมใหม่ = เริ่มใหม่ทั้งหมด, จำเฉพาะตอนกดเซฟ) =====
const SAVE_SLOTS=3, SAVE_KEY=i=>'tol_slot_'+i;
let saveNote='';
function canSaveNow(){return !(G&&G.bh>0&&G.hp>0&&!G.between&&G.f!==undefined&&$('#bk').style.display==='block')}
function runSnapshot(){
  if(!G||!G.between||!G.weapon) return null;
  const k=['gold','bonusAtk','bonusDmgReduce','bonusTime','bonusPierce','bonusQa','bonusQd','startUlt','revive','bonusMx'];
  const r={next:G.f+1,weapon:G.weapon};k.forEach(x=>r[x]=G[x]||0);return r;
}
function makeSave(){return {v:1,at:Date.now(),DK,UN,CLEARED:[...CLEARED],MISS:[...MISS],BANK,TR_BEST,run:runSnapshot()}}
function readSlot(i){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY(i))||'null');return s&&s.v?s:null}catch(e){return null}}
function applySave(s){
  if(!s||!s.v) throw new Error('bad');
  DK=DIFFS[s.DK]?s.DK:'normal';applyDiff();
  UN=Math.max(1,Math.min(6,+s.UN||1));CLEARED=new Set((s.CLEARED||[]).filter(n=>n>=0&&n<6));
  MISS=new Set((s.MISS||[]).filter(w=>WI[w]));BANK=Math.max(0,Math.min(9,+s.BANK||0));TR_BEST=s.TR_BEST||{};
  G={};
  if(s.run&&s.run.weapon&&s.run.next<P.length){
    const r=s.run;G={f:r.next-1,learned:new Set(),ult:0,tCount:1,weapon:r.weapon,between:true};
    ['gold','bonusAtk','bonusDmgReduce','bonusTime','bonusPierce','bonusQa','bonusQd','startUlt','revive','bonusMx'].forEach(x=>G[x]=+r[x]||0);
    G.mx=DF().php(r.next)+(G.bonusMx||0);G.hp=G.mx;G.pendingRun=true;
  }
}
const fmtDate=t=>{try{return new Date(t).toLocaleString(LANG==='en'?'en-GB':'th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function slotInfo(s){
  if(!s) return '<span class="sv-empty">— ช่องว่าง —</span>';
  const D=DIFFS[s.DK]||DIFFS.normal,r=s.run;
  return `<b>${D.icon} ${D.name} · ปลดล็อก ${s.UN}/6 ชั้น</b>
    <small>${r?`⚔️ กำลังผจญภัย → ชั้นถัดไป ${r.next+1} · 🗡️ ${r.weapon.name} · 🪙 ${r.gold}`:'🏰 ไม่มีการผจญภัยค้างอยู่'}</small>
    <small>📕 ทบทวน ${(s.MISS||[]).length} คำ · 💎 ${s.BANK||0} · 🕒 ${fmtDate(s.at)}</small>`;
}
function openSaves(from='menu'){
  const can=canSaveNow();
  G.lock=true;
  ovl(`<div class="paper-box" style="max-width:520px;gap:8px;max-height:92vh;overflow-y:auto">
    <h2 class="ptitle">💾 เซฟ / โหลดเกม</h2>
    <div class="qins" style="margin:0">เกมจะเริ่มใหม่ทุกครั้งที่เปิด — กด <b>เซฟ</b> เพื่อเก็บความคืบหน้า แล้วกด <b>โหลด</b> เพื่อเล่นต่อ${can?'':'<br><b style="color:#b91c1c">⚠️ เซฟได้เฉพาะตอนอยู่เมนู หรือหลังชนะบอส</b>'}</div>
    ${saveNote?`<div class="sv-note">${saveNote}</div>`:''}
    ${Array.from({length:SAVE_SLOTS},(_,k)=>{const i=k+1,s=readSlot(i);return `<div class="sv-slot">
      <div class="sv-n">${i}</div>
      <div class="sv-info">${slotInfo(s)}</div>
      <div class="sv-btns">
        <button class="sv-b save" ${can?'':'disabled'} onclick="doSave(${i},'${from}')">💾 ${s?'เซฟทับ':'เซฟ'}</button>
        <button class="sv-b load" ${s?'':'disabled'} onclick="doLoad(${i})">📂 โหลด</button>
        ${s?`<button class="sv-b del" onclick="doDel(${i},this,'${from}')">🗑️</button>`:''}
      </div></div>`}).join('')}
    <div class="sv-file">
      <button class="sv-b" ${can?'':'disabled'} onclick="exportSave()">📤 ส่งออกเป็นไฟล์</button>
      <label class="sv-b">📥 โหลดจากไฟล์<input type="file" accept=".json,application/json" style="display:none" onchange="importSave(this)"></label>
    </div>
    <div style="font-size:11px;color:#8a7a60;text-align:center">💡 ไฟล์เซฟ (.json) ใช้ย้ายไปเล่นเครื่องอื่น หรือสำรองไว้กันข้อมูลหายได้</div>
    <button class="btn paper-card" onclick="${from==='menu'?'gotoMenu()':'saveBack()'}">← กลับ</button>
  </div>`);
  saveNote='';
}
function saveBack(){if(G.between&&G.lastWin)renderWinScreen(...G.lastWin);else gotoMenu()}
function doSave(i,from){
  if(!canSaveNow())return;
  const old=readSlot(i);
  try{localStorage.setItem(SAVE_KEY(i),JSON.stringify(makeSave()));saveNote=`✅ เซฟลงช่อง ${i} แล้ว${old?' (ทับข้อมูลเดิม)':''}`;SFX.buy()}
  catch(e){saveNote='❌ เซฟไม่สำเร็จ (เบราว์เซอร์ไม่อนุญาตให้เก็บข้อมูล) — ลองใช้ 📤 ส่งออกเป็นไฟล์ แทน';SFX.bad()}
  openSaves(from);
}
function doLoad(i){const s=readSlot(i);if(!s)return;try{applySave(s);afterLoad(`📂 โหลดช่อง ${i} สำเร็จ!`)}catch(e){saveNote='❌ ไฟล์เซฟเสียหาย';openSaves()}}
function doDel(i,btn,from){
  if(btn.dataset.sure){try{localStorage.removeItem(SAVE_KEY(i))}catch(e){}saveNote=`🗑️ ลบช่อง ${i} แล้ว`;openSaves(from);return}
  btn.dataset.sure=1;btn.textContent='ยืนยันลบ?';btn.classList.add('sure');
}
function exportSave(){
  if(!canSaveNow())return;
  const blob=new Blob([JSON.stringify(makeSave(),null,1)],{type:'application/json'});
  const a=document.createElement('a');const d=new Date();
  a.href=URL.createObjectURL(blob);a.download=`tower-of-language-save-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  SFX.buy();
}
function importSave(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();

// เพลง: Eldenia Music Pack (Royalty Free RPG Music) — วางไฟล์ boss_bgm.mp3 ไว้ในโฟลเดอร์เดียวกับเกม · แก้ช่วงเวลาได้ที่นี่ (หน่วย: วินาที)
const BGM={file:'boss_bgm.mp3',start:0,end:34,vol:0.45}; // ไฟล์ถูกตัดมาจากช่วง 0:21–0:55 ของเพลงต้นฉบับแล้ว
let bgmEl=null,bgmWant=false,bgmFadeT=null,synthT=null;
function bgmFade(to,ms,done){if(!bgmEl)return done&&done();clearInterval(bgmFadeT);const from=bgmEl.volume,t0=Date.now();bgmFadeT=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/ms);try{bgmEl.volume=Math.max(0,Math.min(1,from+(to-from)*k))}catch(e){}if(k>=1){clearInterval(bgmFadeT);done&&done()}},40)}
function bgmPlay(){
  bgmWant=true;if(mute)return;
  if(!bgmEl){
    bgmEl=new Audio(encodeURI(BGM.file));bgmEl.preload='auto';bgmEl.volume=0;
    bgmEl.addEventListener('timeupdate',()=>{if(bgmEl.currentTime>=BGM.end-0.15||bgmEl.currentTime<BGM.start-0.5)bgmEl.currentTime=BGM.start});
    bgmEl.addEventListener('ended',()=>{bgmEl.currentTime=BGM.start;if(bgmWant&&!mute)bgmEl.play().catch(()=>{})});
    bgmEl.addEventListener('error',()=>{bgmEl.failed=true;if(bgmWant&&!mute)synthStart()});
  }
  if(bgmEl.failed)return synthStart();
  const go=()=>{try{bgmEl.currentTime=BGM.start}catch(e){}bgmEl.volume=0;bgmEl.play().then(()=>{if(!bgmWant||mute){try{bgmEl.pause()}catch(e){}return}bgmFade(BGM.vol,1200)}).catch(()=>{})};
  if(bgmEl.readyState>=1)go();else bgmEl.addEventListener('loadedmetadata',go,{once:true});
}
function bgmStop(){bgmWant=false;synthStop();if(bgmEl&&!bgmEl.paused)bgmFade(0,700,()=>{if(!bgmWant||mute){try{bgmEl.pause()}catch(e){}}})}
// เพลงสำรอง (แต่งเองด้วย WebAudio) ใช้เมื่อไม่มีไฟล์ boss_bgm.mp3
function synthStart(){
  if(synthT||mute)return;
  const bass=[45,45,48,45,43,43,41,40],arp=[0,3,7,12,7,3],hz=n=>440*Math.pow(2,(n-69)/12);let st=0;
  synthT=setInterval(()=>{if(mute||!bgmWant)return;const bar=(st/8|0)%bass.length,b=bass[bar];
    if(st%2===0)tone(hz(b),.22,'sawtooth',.05);
    tone(hz(b+24+arp[st%arp.length]),.12,'triangle',.035);
    if(st%8===0)noise(.12,180,.12);if(st%8===4)noise(.08,2500,.06);
    st++},160);
}
function synthStop(){clearInterval(synthT);synthT=null}

const KING_POOL=['king','kmirror','keclipse','kscale','kcurse','kflip'];

  const pool=G.bh<=P[G.f].h/2?KING_POOL.concat(KING_P2):KING_POOL;const c=pool.filter(k=>k!==G.kingLast);const k=c[Math.random()*c.length|0];G.kingLast=k;return k;

const spellEvery=(id)=>{const b=id==='king'&&G.bh<=P[G.f].h/2?2:BOSS_SPELLS[id].every;return DK==='hard'?Math.max(2,b-1):b};
async function bossHit(n){await atk(true,n,()=>{G.bh-=n;hud()})}
async function heroHit(n){await atk(false,n,()=>{G.hp-=n;hud()})}
function bossSpell(id){
  const S=BOSS_SPELLS[id],F=P[G.f];
  return new Promise(async resolve=>{
    G.lock=true;btns(0,0);SFX.warn();
    $('#ba').classList.add('hit');await showBanner(`${S.icon} ${F.n} ร่าย "${S.name}"!`,'');$('#ba').classList.remove('hit');
    say(F.n,S.quote);
    const res=[];let qi=0,rushEnd=0;
    const all=floorWords(G.f);
    const timeFor=q=>Math.max(4000,QM[q.mode].time+DF().time-(id==='archive'?1000:0)+((G.weapon?.bonusTime||0)+(G.bonusTime||0)));
    if(S.rush) rushEnd=Date.now()+Math.max(9000,4500*S.n+DF().time+((G.weapon?.bonusTime||0)+(G.bonusTime||0)));
    const ask=()=>{
      let c=all.filter(w=>!G.used.includes(w));if(!c.length){G.used=[];c=all}
      const q=makeQ(c[Math.random()*c.length|0],S.mode||null,all);G.used.push(q.key);
      const totalMs=S.rush?Math.max(0,rushEnd-Date.now()):timeFor(q),t0=Date.now();
      ovl(`<div class="paper-box quiz-box fc-box">
        <div class="fc-head">${S.icon} ${S.name}! <small>สกิลบอส Lv.${F.lv} ${F.n}${S.n>1?` · ข้อ ${qi+1}/${S.n}`:''}</small></div>
        <div class="fc-rule">${S.rule().map(r=>{const bad=/ผิด|ไม่ทัน/.test(r),warn=/⚠️/.test(r),good=!bad&&!warn&&/ถูก/.test(r);return `<span class="${bad||warn?'r':good?'g':''}">${bad?'❌ ':good?'✅ ':warn?'':'📜 '}${r}</span>`}).join('')}</div>
        ${S.n>1?`<div class="fc-dots">${Array.from({length:S.n},(_,k)=>`<i class="${k<res.length?(res[k]?'g':'r'):k===qi?'cur':''}"></i>`).join('')}</div>`:''}
        <div class="qtimer"><span>⏱️</span><div id="tbar"><div id="tfill"></div></div><b id="skill-timer-txt">${(totalMs/1000).toFixed(1)}</b></div>
        ${quizBody(q)}
      </div>`);
      if(S.noThai||S.mode==='listen') document.querySelectorAll('.qopt .qs').forEach(e=>e.remove());
      if(S.noThai) document.querySelectorAll('.qw small,.qtip').forEach(e=>e.remove());
      if(q.mode!=='blank'&&q.mode!=='mirror') setTimeout(()=>speakWord(q.key),150);
      let done=false;
      const finish=o=>{
        if(done||!$('.fc-box'))return;done=true;
        if(G.skillTimerInterval){clearInterval(G.skillTimerInterval);G.skillTimerInterval=null}
        const ok=o===q.a;res.push(ok);
        markOpts(q,o);noteResult(q,ok);ok?SFX.ok():SFX.bad();speakWord(q.mode==='anto'?q.a:q.key);
        const last=res.length>=S.n||(S.rush&&Date.now()>=rushEnd);
        $('.fc-box').insertAdjacentHTML('beforeend',`<div class="rv-box">${reviewHTML(q,o,ok?'ok':o==='__TIMEOUT__'?'timeout':'wrong')}</div><button class="btn gobtn" id="nx">${last?'ดูผลเวท ➔':'ข้อต่อไป ➔'}</button>`);
        setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60);
        const pausedAt=Date.now(); // หยุดนับเวลารวมระหว่างอ่านเฉลย
        $('#nx').onclick=async()=>{
          if(S.rush) rushEnd+=Date.now()-pausedAt;
          if(!last){qi++;ask();return}
          while(res.length<S.n)res.push(false);
          ovl(null);
          await S.result(res);
          if(G.hp<=0&&G.revive>0){G.revive--;G.hp=Math.round(G.mx*.5);SFX.heal();await showBanner('🔥 ชุบชีวิตด้วยขนนกฟีนิกซ์!','g');hud()}
          resolve();
        };
      };
      G.skillTimerInterval=setInterval(()=>{
        const rem=Math.max(0,totalMs-(Date.now()-t0)),tt=$('#skill-timer-txt'),fl=$('#tfill');
        if(tt)tt.textContent=rem<=0?'หมดเวลา!':(rem/1000).toFixed(1);
        if(fl){const pc=totalMs?rem/totalMs*100:0;fl.style.width=pc+'%';if(pc<30)fl.classList.add('low')}
        if(rem<=0)finish('__TIMEOUT__');
      },50);
      document.querySelectorAll('.qopt').forEach(c=>c.onclick=()=>finish(c.dataset.o));
    };
    ask();
  });
}

// ===== ระบบรูนภาษา: คำถาม 4 รูปแบบ =====
const QM={
  anto:{tag:'🔮 Antonym Rune',th:'คำตรงข้าม',time:7000,ins:'เลือกคำภาษาอังกฤษที่มีความหมาย <b>ตรงข้าม</b>'},
  mean:{tag:'📘 Meaning Rune',th:'แปลความหมาย',time:7000,ins:'เลือก <b>ความหมายภาษาไทย</b> ที่ถูกต้องของคำนี้'},
  blank:{tag:'📜 Scroll Rune',th:'เติมคำในประโยค',time:11000,ins:'เลือกคำที่เติมใน <b>ช่องว่าง</b> แล้วได้ประโยคที่ถูกต้อง'},
  listen:{tag:'👂 Echo Rune',th:'ฟังแล้วเลือก',time:8000,ins:'ฟังเสียงอ่าน แล้วเลือกคำที่ <b>ได้ยิน</b>'},
  mirror:{tag:'🪞 Mirror Rune',th:'คำในกระจก',time:9000,ins:'อ่านคำจากขวาไปซ้าย แล้วเลือกคำที่ถูก'}
};
const canSpeak=()=>'speechSynthesis' in window;
function randMode(){const r=Math.random();let m=r<.32?'anto':r<.54?'mean':r<.82?'blank':'listen';if(m==='listen'&&!canSpeak())m='blank';return m}
function makeQ(word,mode,pool){
  const W=WI[word];mode=mode||randMode();
  if(mode==='blank'&&!EX[word])mode='anto';
  const others=sh(pool.filter(x=>x!==word&&x!==W.opp));
  let a=word,opts;
  if(mode==='anto'){a=W.opp;opts=sh([a,...others.slice(0,4)]).map(v=>({v,l:v,s:TH[v]}))}
  else if(mode==='mean'){opts=sh([word,W.opp,...others.slice(0,2)]).map(v=>({v,l:TH[v]}))}
  else if(mode==='blank'){opts=sh([word,W.opp,...others.slice(0,2)]).map(v=>({v,l:v}))}
  else{opts=sh([word,...others.slice(0,3)]).map(v=>({v,l:v}))}
  return {mode,key:word,a,ta:TH[a],opts,mir:mode==='mirror'?word.toUpperCase().split('').reverse().join(''):''};
}
const floorWords=f=>P[f].w.flatMap(p=>[p[0],p[2]]);
function pickQ(){
  const all=floorWords(G.f);
  let c=all.filter(w=>!G.used.includes(w));
  if(!c.length){G.used=[];c=all}
  return makeQ(c[Math.random()*c.length|0],null,all);
}
const spkBtn=(w,cls='spk')=>`<button class="${cls}" onclick="event.stopPropagation();speakWord('${w}')" title="ฟังเสียงอ่าน">🔊</button>`;
function quizBody(q){
  const M=QM[q.mode],W=WI[q.key],f=W.f,ex=P[(f+1)%P.length].w[0];
  let ask='',eq='',tip='';
  const slot=`<span id="qslot" class="slot slot-${q.mode}">?</span>`;
  if(q.mode==='anto'){
    ask=`คำไหนมีความหมาย <b class="hl">ตรงข้าม</b> กับคำนี้?`;

function speakSlow(t){if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.55;speechSynthesis.speak(u)}catch(e){}}
function markOpts(q,o){

  document.querySelectorAll('.qpick,.qtip').forEach(e=>e.remove());
}
function reviewHTML(q,o,kind){

  return `<div class="rv-head" style="color:${head[1]}">${head[0]}</div>${picked}

ovl(`<div class="paper-box" style="max-width:460px;gap:8px">

function skill(k){
    const side=G.att==='p'?'a':'d';if(G.en<skCost(side))return;G.lock=true;G.sk=true;G.en-=skCost(side);btns(0,0);const q=pickQ();G.used.push(q.key);
    if(G.skillTimerInterval) clearInterval(G.skillTimerInterval);
    const penaltyMs = P[G.f]?.buff?.id === 'archive' ? 1000 : 0;
    const bonusTimeMs = (G.weapon?.bonusTime || 0) + (G.bonusTime || 0);
    const totalTimeMs = Math.max(3000, QM[q.mode].time + DF().time + bonusTimeMs - penaltyMs);
    const startTime = Date.now();
    G.qTime = startTime;
    G.qTotalTimeMs = totalTimeMs;
    ovl(`<div class="paper-box quiz-box">
       <div class="qtimer"><span>⏱️</span><div id="tbar"><div id="tfill"></div></div><b id="skill-timer-txt">${(totalTimeMs/1000).toFixed(1)}</b></div>
       ${quizBody(q)}
       <button id="skip-q-btn" class="skipbtn">🏳️ ไม่ตอบ / ยอมรับผลตรงข้าม</button>
    </div>`);
    if(q.mode!=='blank') setTimeout(()=>speakWord(q.key),150);
    G.skillTimerInterval = setInterval(() => {
        const remaining = Math.max(0, totalTimeMs - (Date.now() - startTime));
        const timerTxt = $('#skill-timer-txt'), fillEl = $('#tfill');
        if(timerTxt) timerTxt.textContent = remaining<=0 ? 'หมดเวลา!' : (remaining/1000).toFixed(1);
        if(fillEl){const pct=Math.max(0,Math.min(100,remaining/totalTimeMs*100));fillEl.style.width=pct+'%';if(pct<30)fillEl.classList.add('low')}
        if(remaining <= 0) {
            clearInterval(G.skillTimerInterval);
            G.skillTimerInterval = null;
            ans(k, q, '__TIMEOUT__');
        }
    }, 50);
    document.querySelectorAll('.qopt').forEach(c=>c.onclick=()=>ans(k,q,c.dataset.o));
    const skipBtn = $('#skip-q-btn');
    if(skipBtn) skipBtn.onclick = () => ans(k, q, '__SKIP__');
}

function ans(k,q,o){
    if(G.skillTimerInterval) {
        clearInterval(G.skillTimerInterval);
        G.skillTimerInterval = null;
    }
    if(!$('.quiz-box')) return;
    const isTimeout = o === '__TIMEOUT__';
    const isSkip = o === '__SKIP__';
    const ok = !isTimeout && !isSkip && o === q.a;
    let fast = false;
    if(G.qTime) {
        fast = ok && ((Date.now() - G.qTime) < (G.qTotalTimeMs || 7000) * 0.5); // ตอบภายในครึ่งเวลา = ตอบไว
        G.qTime = 0;
    }
    const skipBtn = $('#skip-q-btn');
    if(skipBtn) skipBtn.remove();
    markOpts(q,o);
    noteResult(q,ok);
    ok ? SFX.ok() : SFX.bad();
    speakWord(q.mode==='anto'?q.a:q.key);
    setStatus(ok ? 'Correct!' : (isTimeout ? 'Time Out!' : (isSkip ? 'Skipped!' : 'Incorrect!')));
    $('#st').style.color=ok?'#5dff9a':'#ff7a7a';
    const why = reviewHTML(q,o,ok?'ok':isTimeout?'timeout':isSkip?'skip':'wrong');

    const failPenalties = {
        pow: '💥 ผลตรงข้าม: พลังตีกลับ! ดาเมจจะเป็น 0 และจะเสีย HP ตัวเองเมื่อทอยเต๋า',
        cur: '💀 ผลตรงข้าม: คำสาปตีกลับ! คุณจะถูกลดลูกเต๋าเหลือทอยได้แค่ 1 ลูก',
        par: '💔 ผลตรงข้าม: การ์ดแตก! ป้องกันไม่สำเร็จและจะโดนบอสทำดาเมจเพิ่มขึ้น',
        hea: '🩸 ผลตรงข้าม: พลังรักษาตีกลับ! คุณจะเสีย HP ตามแต้มเต๋า 2 ลูกทันที'
    };
    let extra='';
    
    if (ok) {
        if(!G.learned.has(q.key)){ G.learned.add(q.key); G.hp=Math.min(G.mx, G.hp+2); extra += '<div style="color:#15803d;font-weight:bold;font-size:15px;margin-top:4px">💚 ฟื้นฟู +2 HP (เรียนรู้คำศัพท์ใหม่!)</div>'; }
        if (G.weapon?.healOnCorrect) {
            const h = G.weapon.healOnCorrect;
            G.hp = Math.min(G.mx, G.hp + h);
            extra += `<div style="color:#15803d;font-weight:bold;font-size:15px;margin-top:4px">✨ พลังคทาฟื้นฟู +${h} HP</div>`;
        }
        const stars = G.weapon?.doubleUlt ? 2 : 1;
        G.ult = Math.min((G.ult||0) + stars, 3);
        G.en = Math.min(EN_MAX, G.en + 1);
        extra += `<div style="color:#7c3aed;font-weight:bold;font-size:15px;margin-top:4px">⚡ ได้พลังงานคืน +1 (${G.en}/${EN_MAX})</div>`;
        extra += `<div style="color:#dc2626;font-weight:bold;font-size:15px;margin-top:4px">⚡ พลังไม้ตาย +${stars} ดาว</div>`;
        setTimeout(()=>SFX.heal(), 400);
        if(fast) {
            G.gold = (G.gold || 0) + 1;
            extra += `<div style="color:#d97706;font-weight:bold;font-size:15px;margin-top:4px">🪙 +1 เหรียญทอง (โบนัสตอบไวภายในครึ่งเวลา!)</div>`;
            setTimeout(()=>SFX.coin(), 250);
        }
    } else {
        extra = `<div style="color:#b91c1c;font-weight:bold;font-size:14px;margin-top:8px;background:#fef2f2;padding:8px 10px;border-radius:6px;border:1.5px dashed #f87171;line-height:1.4">
            ${failPenalties[k] || '⚠️ สกิลล้มเหลว! เกิดผลลัพธ์ตรงข้าม'}
        </div>`;
    }
    
    $('.quiz-box').insertAdjacentHTML('beforeend', `<div class="rv-box">${why}${extra}</div><button class="btn gobtn" id="nx">เข้าใจแล้ว ➔ กลับไปสู้ต่อ</button>`);
    setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60);
    
    $('#nx').onclick=async()=>{
        if(G.skillTimerInterval) { clearInterval(G.skillTimerInterval); G.skillTimerInterval = null; }
        $('#st').style.color='';ovl(null);hud();G.mod[k]=ok?1:-1;
        showBanner(ok?'SKILL SUCCESS!':'⚠️ SKILL FAILED! (ผลตรงข้าม)',ok?'g':'');
        const heroSay = ok 
            ? 'ถูกต้อง! พลังภาษาเป็นของข้า!' 
            : (isTimeout ? 'ตอบไม่ทัน…เกิดผลตรงข้ามเสียแล้ว!' : (isSkip ? 'ไม่ยอมตอบ…เกิดผลตรงข้ามเสียแล้ว!' : 'ตอบผิด…เกิดผลตรงข้ามเสียแล้ว!'));
        ok ? say('ฮีโร่', heroSay) : (SFX.warn(), say('ฮีโร่', heroSay));
        
        if(k==='hea'){
            const r=await rollTo('p',2),s=sum(r);
            G.hp=ok?Math.min(G.mx,G.hp+s):G.hp-s;
            hud();
            ok?SFX.heal():SFX.hit();
            setStatus(ok?`ฟื้น HP +${s}`:`เสีย HP -${s} (ผลตรงข้าม!)`);
            await sl(1200);
            if(G.hp<=0){
                if(G.revive > 0){
                    G.revive--;
                    G.hp = Math.round(G.mx * 0.5);
                    SFX.heal();
                    await showBanner('🔥 ชุบชีวิตด้วยขนนกฟีนิกซ์!', 'g');
                    hud();
                } else {
                    return lose();
                }
            }
        }
        setStatus(ok?'สกิลสำเร็จ! กดทอยเต๋าเพื่อสู้ต่อ':'สกิลเกิดผลตรงข้าม! กดทอยเต๋าเพื่อสู้ต่อ');
        G.lock=false;btns(1,0);
    }
}

$('#roll').onclick=async()=>{
    if(G.lock)return;
    G.lock=true;
    btns(0,0);
    const ap=G.att==='p',m=G.mod,F=P[G.f];
    const wp=G.weapon||{};
    
    let isUlt = false;
    if (ap && G.ult >= 3) {
        isUlt = true;
        G.ult = 0; 
        m.pow = 1; 
        await showBanner('💥 ULTIMATE BURST!', 'g');
        SFX.heal();
        hud(); 
    }

    let na=2,nd=2;
    let extraDieMsg = '';
    // เวทมนตร์: มีโอกาสทอยเต๋าโจมตีเพิ่ม 1 ลูก
    if(ap && wp.extraAtkDieChance && Math.random() < wp.extraAtkDieChance) {
        na = 3;
        extraDieMsg = ' (สายฟ้าทอยเต๋า +1 ลูก!)';
    }
    // บัฟบอส Chrono Golem: เทิร์นคู่ บอสทอยเต๋า 3 ลูก
    if(F.buff?.id === 'chrono' && G.tCount % 2 === 0) {
        if(ap) nd = 3; else na = 3;
        extraDieMsg += ' (⏳เฟืองเวลา: บอสเต๋า 3 ลูก!)';
    }
    if(ap){
        if(m.cur===1) { nd = 1; extraDieMsg += ' (✨คำสาป: บอสเต๋าเหลือ 1 ลูก!)'; }
        if(m.cur===-1) { na = 1; extraDieMsg += ' (💀คำสาปตีกลับ: คุณเต๋าเหลือ 1 ลูก!)'; }
    }
    
    let A=await rollTo(ap?'p':'b',na),D=await rollTo(ap?'b':'p',nd);
    // 🙃 เวท The Inverted King: แต้มเต๋าผู้เล่นกลับด้าน 1 ครั้ง
    if(G.flip){
        G.flip=0;const fl=a=>a.map(v=>v>0?7-v:v);
        if(ap)A=fl(A);else D=fl(D);
        $('#dp').innerHTML=dice(ap?A:D).replace(/class="die"/g,'class="die flash"');
        extraDieMsg+=' (🙃ลูกเต๋ากลับด้าน!)';await sl(500);
    }

    // บัฟบอส Abyss Warden: เต๋าผู้เล่นที่ออก 1 จะถูกกลืนแต้มเป็น 0
    if(F.buff?.id === 'abyss') {
        if(ap && A.includes(1)) {
            A = A.map(v => v === 1 ? 0 : v);
            extraDieMsg += ' (🌊หมอกเหวกลืนเต๋า 1!)';
        } else if(!ap && D.includes(1)) {
            D = D.map(v => v === 1 ? 0 : v);
            extraDieMsg += ' (🌊หมอกเหวกลืนเต๋า 1!)';
        }
    }

    let sa=sum(A), sd=sum(D);

    // ระดับบอส: บอสตั้งรับมีเกราะป้องกันตามระดับชั้น
    if(ap && F.def > 0) {
        sd += F.def;
        extraDieMsg += ` (🛡️เกราะบอส +${F.def})`;
    }
    // ระดับบอส: บอสโจมตีมีพลังโจมตีตามระดับชั้น
    if(!ap && F.atk) {
        sa = Math.max(0, sa + F.atk);
        extraDieMsg += ` (⚔️พลังบอส ${F.atk>0?'+':''}${F.atk})`;
    }

    // ธนู / โบนัสเจาะเกราะ: ลดแต้มป้องกันของบอส
    const totalPierce = (wp.pierce || 0) + (G.bonusPierce || 0);
    if(ap && totalPierce > 0 && sd > 0) {
        sd = Math.max(0, sd - totalPierce);
    }
    // บัฟบอส The Inverted King: บอสเจาะเกราะทะลุ 1 แต้ม
    if(!ap && F.buff?.id === 'king' && sd > 0) {
        sd = Math.max(0, sd - 1);
        extraDieMsg += ' (👑ราชาเจาะเกราะ 1!)';
    }

    let dmg=Math.max(0,sa-sd),msg='',cc=0,boss_cc=0;
    
    // โบนัสดาเมจของอาวุธ + อัปเกรดร้านค้า
    const totalAtk = (wp.atkBonus || 0) + (G.bonusAtk || 0) + DF().atk;
    if(ap && totalAtk > 0 && (dmg > 0 || (totalPierce > 0 && sa >= sd))) {
        dmg += totalAtk;
    }

    // ธนู: คริติคอลเมื่อทอยได้หน้า 6
    if(ap && wp.critDmg && A.includes(6) && dmg > 0) {
        dmg += wp.critDmg;
        msg += ` ⚡คริติคอล +${wp.critDmg}!`;
    }

    // ธนู: โอกาสยิงเบิ้ลเมื่อทอยได้หน้า 3 (ธนูประกายแสงคู่)
    let doubleShot = false;
    if(ap && wp.doubleShotOn3 && A.includes(3)) {
        doubleShot = true;
        if(wp.gainDodge) {
            G.dodge = (G.dodge || 0) + 1;
            msg += ' 💨เตรียมหลบหลีก!';
        }
    }

    // ดาบ: ฟันซ้ำเมื่อทอยได้หน้า 4 (ดาบโลหิตพิฆาต)
    let swordCombo = false;
    if(ap && wp.comboDmgOn4 && A.includes(4)) {
        swordCombo = true;
    }

    // คทา: เบิ้ลดาเมจเมื่อทอยได้หน้า 2 หรือ 6 (คทาดาราประกายแสง)
    if(ap && wp.doubleDmgDice && A.some(d => wp.doubleDmgDice.includes(d))) {
        if(dmg > 0) {
            dmg = dmg * 2;
            msg += ' ✨คทาดาราเบิ้ลดาเมจ ×2!';
        }
        if(wp.gainShield) {
            G.shield = (G.shield || 0) + 1;
            msg += ' 🛡️ได้รับโล่คุ้มภัย!';
        }
    }

    if(ap){
        // บัฟบอส Archive Keeper: ลดดาเมจที่ได้รับ 1 หน่วย
        if(F.buff?.id === 'archive' && dmg > 0) {
            dmg = Math.max(1, dmg - 1);
            msg += ' 📖เกราะตำรา -1!';
        }

        // บัฟบอส Mirror General: หากดาเมจเป็น 0 บอสจะสวนกลับ 2 ดาเมจ
        if(F.buff?.id === 'general' && dmg === 0) {
            boss_cc = 2;
            msg += ' ⚔️แม่ทัพสวนกลับ 2!';
        }

        if(m.pow===1) {
            const mult = wp.ultMult || 2;
            dmg = Math.round(dmg * mult);
            msg += ' 💥Power Strike ดาเมจ ×2!';
        }
        if(m.pow===-1) {
            const recoil = Math.max(2, d6());
            dmg = 0;
            boss_cc = (boss_cc || 0) + recoil;
            msg += ` 💥พลังตีกลับ! ดาเมจเป็น 0 และเสีย ${recoil} HP!`;
            SFX.hit();
        }
    } else {
        // บอสโจมตี:
        // บัฟบอส Mirror Wolf: ทำดาเมจเพิ่ม +1 เมื่อโจมตีสำเร็จ
        if(F.buff?.id === 'wolf' && dmg > 0) {
            dmg += 1;
            msg += ' 🐺คมเล็บ +1!';
        }

        // บัฟบอส The Inverted King: คลุ้มคลั่งเมื่อ HP <= 25 (+2 ดาเมจ)
        if(F.buff?.id === 'king' && G.bh <= F.h/2 && dmg > 0) {
            dmg += 2;
            msg += ' 👑ราชาคลุ้มคลั่ง +2!';
        }

        // เทิร์นป้องกัน: ลดดาเมจจากเกราะ/ความคล่องตัวของผู้เล่น + ยันต์เกราะทองคำ
        const totalReduce = (wp.dmgReduce || 0) + (G.bonusDmgReduce || 0);
        if(totalReduce > 0 && dmg > 0) {
            dmg = Math.max(0, dmg - totalReduce);
        }
        if(G.stun && dmg > 0){ dmg = 0; G.stun = 0; msg += ' 🔒บอสถูกผนึก โจมตีไม่เข้า!'; }
        if(m.par===1){
            dmg=0;cc=d6() + (wp.parryBonus || 0);msg=` 🛡️ปัดป้องสำเร็จ! สวนกลับ ${cc}!`;
        } else if(wp.parryBonus && dmg === 0) {
            cc = wp.parryBonus; msg = ` สะท้อนดาเมจ ${cc}!`;
        }
        if(m.par===-1){const x=d6();dmg+=x;msg=` 💔การ์ดแตก! โดนดาเมจเพิ่ม +${x}!`}

        // ตรวจสอบ การหลบหลีก (Dodge) และ โล่คุ้มภัย (Shield)
        if(G.dodge > 0 && dmg > 0) {
            G.dodge--;
            dmg = 0;
            msg += ' 💨หลบหลีกการโจมตีสำเร็จ!';
        } else if(G.shield > 0 && dmg > 0) {
            G.shield--;
            dmg = 0;
            msg += ' 🛡️โล่คุ้มภัยดูดซับดาเมจ!';
        }
    }
    
    setStatus(`${sa} vs ${sd}${extraDieMsg} → ดาเมจ ${dmg}${msg}`);
    if(isUlt && ap) await ultFx(wp.type);
    await atk(ap,dmg,()=>{
        if(ap) {
            G.bh -= dmg;
            // ดาบ: ดูดเลือด
            if(dmg > 0 && wp.lifesteal && G.hp < G.mx) {
                const healAmt = Math.min(wp.lifesteal, G.mx - G.hp);
                G.hp += healAmt;
                fx($('#pa'), '+' + healAmt + ' HP', 1);
            }
        } else {
            G.hp -= dmg;
            // บัฟบอส Abyss Warden: เมื่อบอสทำดาเมจสำเร็จ ฟื้นฟู HP +1
            if(dmg > 0 && F.buff?.id === 'abyss' && G.bh < F.h) {
                G.bh = Math.min(F.h, G.bh + 1);
                fx($('#ba'), '+1 HP 🌊', 1);
            }
        }
        hud();
    });

    // ⚡ ได้พลังงานจากการต่อสู้
    if(ap){ if(dmg>0) gainEn(2); }
    else { gainEn(dmg>0 ? 1 : DF().blk); }
    if(cc) await atk(true,cc,()=>{G.bh-=cc;hud()});
    if(boss_cc) await atk(false,boss_cc,()=>{G.hp-=boss_cc;hud()});

    // ดาบ: คมดาบโลหิต ฟันซ้ำ 4 ดาเมจ + ดูดเลือด 2 HP
    if(ap && swordCombo && G.bh > 0) {
        await sl(300);
        showBanner('🗡️ คมดาบโลหิต ฟันซ้ำ!', 'g');
        const extraDmg = wp.comboDmgOn4 || 4;
        await atk(true, extraDmg, () => {
            G.bh -= extraDmg;
            const drain = Math.min(wp.comboDrainOn4 || 2, G.mx - G.hp);
            if(drain > 0) {
                G.hp += drain;
                fx($('#pa'), '+' + drain + ' HP 🩸', 1);
            }
            hud();
        });
    }

    // ธนู: ศรคู่ยิงซ้ำ 4 ดาเมจ
    if(ap && doubleShot && G.bh > 0) {
        await sl(300);
        showBanner('🏹 ศรคู่ยิงเบิ้ล 4 ดาเมจ!', 'g');
        const extraDmg = wp.doubleShotDmg || 4;
        await atk(true, extraDmg, () => { G.bh -= extraDmg; hud(); });
    }

    if(dmg>0) ap?say(F.n,LN[G.f][1]):say('ฮีโร่','โอ๊ย! เจ็บจริง!');
    
    await sl(900);
    if(G.bh<=0)return win();
    if(G.hp<=0){
        if(G.revive > 0){
            G.revive--;
            G.hp = Math.round(G.mx * 0.5);
            SFX.heal();
            await showBanner('🔥 ชุบชีวิตด้วยขนนกฟีนิกซ์!', 'g');
            hud();
        } else {
            return lose();
        }
    }
    
    G.tCount++;
    G.spDone = false; G.fcDone = false; // รีเซ็ตการเช็คอีเวนต์สำหรับเทิร์นถัดไป
    G.att=ap?'b':'p';
    
    turn();
};

function initLmCanvas() {
    const canvas = document.getElementById('lm-canvas');
    if (!canvas || !lmState) return;
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth || 340;
    canvas.height = 130;
    
    drawLmGuide(ctx, canvas.width, canvas.height);
    lmState.strokes = [];
    lmState.currStroke = null;
    lmState.isDrawing = false;
    
    let strokeStartTime = 0;

    const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.round((e.clientX - rect.left) * (canvas.width / rect.width)),
            y: Math.round((e.clientY - rect.top) * (canvas.height / rect.height))
        };
    };

    canvas.onpointerdown = (e) => {
        canvas.setPointerCapture(e.pointerId);
        lmState.isDrawing = true;
        strokeStartTime = Date.now();
        const { x, y } = getPos(e);
        lmState.currStroke = [[x], [y], [0]];
        ctx.beginPath();
        ctx.strokeStyle = '#1a365d';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(x, y);
    };

    canvas.onpointermove = (e) => {
        if (!lmState.isDrawing || !lmState.currStroke) return;
        const { x, y } = getPos(e);
        lmState.currStroke[0].push(x);
        lmState.currStroke[1].push(y);
        lmState.currStroke[2].push(Date.now() - strokeStartTime);
        ctx.lineTo(x, y);
        ctx.stroke();
    };

    const endStroke = (e) => {
        if (!lmState.isDrawing) return;
        lmState.isDrawing = false;
        if (lmState.currStroke && lmState.currStroke[0].length > 0) {
            lmState.strokes.push(lmState.currStroke);
        }
        lmState.currStroke = null;
    };

    canvas.onpointerup = endStroke;
    canvas.onpointercancel = endStroke;
}

function drawLmGuide(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#ebdcc0';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(10, h * 0.68);
    ctx.lineTo(w - 10, h * 0.68);
    ctx.stroke();
    ctx.setLineDash([]);
}

function clearLmCanvas() {
    const canvas = document.getElementById('lm-canvas');
    if (!canvas || !lmState) return;
    const ctx = canvas.getContext('2d');
    drawLmGuide(ctx, canvas.width, canvas.height);
    lmState.strokes = [];
    lmState.currStroke = null;
}

                    </button>

        }
    } catch (err) {
        console.warn('Handwriting API fallback:', err);
        ovl(`<div class="paper-box" style="max-width:380px;text-align:center">
            <div style="font-size:30px">📝</div>
            <h2 style="color:#b26b00;margin:0 0 6px">ตรวจคำตอบด้วยตนเอง (ออฟไลน์)</h2>
            <p style="margin:4px 0;font-size:14px">คำว่า <b>"${NT(thaiMeaning)}"</b> เฉลยคือ: <b style="color:#1a6fc9;font-size:18px">${targetWord}</b></p>
            <p style="font-size:12px;color:#666">คุณเขียนคำนี้ถูกต้องตามตัวสะกดหรือไม่?</p>

async function win(){
    bgmStop();G.between=true;
    SFX.win();
    say(P[G.f].n,LN[G.f][2],3000);
    setStatus('finish');
    btns(0,0);
    const last=G.f>=5;if(last)G.runOver=true;
    CLEARED.add(G.f);
    UN=Math.max(UN,Math.min(6,G.f+2));
    saveProgress();
    const coinTable = { 1: 2, 2: 3, 3: 3, 4: 4, 5: 4, 6: 0 };
    const bossLv = P[G.f]?.lv || (G.f + 1);
    const reward = coinTable[bossLv] ?? 0;
    G.gold = (G.gold || 0) + reward;
    if(reward > 0) setTimeout(()=>SFX.coin(), 500);

    const wonLm = await luckyMoneyEvent();
    renderWinScreen(reward, last, wonLm);
}

function buyShopItem(idx) {
    const item = currentShopItems[idx];
    if(!item || item.bought) return;
    if(item.canBuy && !item.canBuy()) {
        showBanner('คุณมีไอเทมนี้อยู่แล้ว!', '');
        return;
    }
    if((G.gold || 0) < item.price) {
        SFX.bad();
        showBanner('เหรียญทองไม่พอ!', '');
        return;
    }
    G.gold -= item.price;
    item.bought = true;
    item.buy();
    SFX.buy();
    renderShop();
    hud();
}

function buyShopWeapon() {
    if(!shopWeaponItem || shopWeaponItem.bought) return;
    if((G.gold || 0) < shopWeaponItem.price) {
        SFX.bad();
        showBanner('เหรียญทองไม่พอ!', '');
        return;
    }
    G.gold -= shopWeaponItem.price;
    shopWeaponItem.bought = true;
    G.weapon = shopWeaponItem.rawWeapon;
    SFX.buy();
    renderShop();
    hud();
}

function rerollShop() {
    if((G.gold || 0) < 2) return;
    G.gold -= 2;
    SFX.dice();
    generateShopItems();
    renderShop();
    hud();
}

function lose(){bgmStop();SFX.lose();say('ฮีโร่','ข้า…ยังไม่พร้อมพอ…',3000);setStatus('finish');btns(0,0);ovl(`<div class="paper-box" style="max-width:420px;text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px"><img src="${encodeURI(FLOOR_IMGS[G.f])}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;border:2px solid #dc3545"><h2 style="margin:0;color:#dc3545">พ่ายแพ้ในชั้น ${G.f+1}</h2></div><p style="margin:4px 0"><b>ศัพท์ชั้น ${G.f+1}: ${P[G.f].t}</b></p>${list()}<button class="btn paper-card" onclick="floor()">ลองชั้นนี้อีกครั้ง</button><div style="font-size:12px;color:#6a5238;margin:4px 0">🗡️ อาวุธ <b>${G.weapon?.name||'-'}</b> และของที่ซื้อไว้ยังอยู่ครบ</div><button class="btn paper-card" onclick="openWeaponSelect(0)">🔄 เริ่มผจญภัยใหม่ (เลือกอาวุธใหม่)</button>${nav}</div>`)}

// ===== 🏛️ ลานฝึกเวท (Training Hall): ฝึกศัพท์นอกการต่อสู้ =====
let TR=null;
function training(){
    G.lock=true;
    const miss=[...MISS].filter(w=>WI[w]);
    ovl(`<div class="paper-box" style="max-width:560px;gap:8px;max-height:92vh;overflow-y:auto">
      <h2 class="ptitle">🏛️ ลานฝึกเวท <small>Training Hall</small></h2>
      <div class="qins" style="margin:0">ฝึกรูนภาษา 10 ข้อแบบไม่จับเวลา · ได้ <b>7 ข้อขึ้นไป</b> รับ <b>💎 คริสตัล 1 เม็ด</b> (แลกเป็น 🪙 ตอนเริ่มผจญภัยครั้งถัดไป)</div>
      <div class="bankrow">💎 คริสตัลสะสม: <b>${BANK}</b>/9</div>
      <button class="trbtn miss" ${miss.length?'':'disabled'} onclick="trStart('miss')">
        <span class="tri">📕</span><span><b>ทบทวนคำที่เคยผิด</b><small>${miss.length?`มี ${miss.length} คำรอทบทวน — ตอบถูกแล้วคำจะหายจากรายการ`:'ยังไม่มีคำที่ผิด เก่งมาก!'}</small></span>
      </button>
      <div class="trgrid">
        ${P.map((f,i)=>{const open=i<UN;const best=TR_BEST[i];return `<button class="trbtn" ${open?'':'disabled'} onclick="trStart(${i})">
          <img src="${encodeURI(FLOOR_IMGS[i])}" alt="">
          <span><b>ชั้น ${i+1}: ${f.t}</b><small>${open?(best!=null?`สถิติสูงสุด ${best}/10`:'ยังไม่เคยฝึก'):'🔒 ปลดล็อกชั้นนี้ก่อน'}</small></span>
        </button>`}).join('')}
      </div>
      <button class="btn paper-card" onclick="gotoMenu()">← กลับเมนูหลัก</button>
    </div>`);
}
function trStart(src){
    let words = src==='miss' ? [...MISS].filter(w=>WI[w]) : floorWords(src);
    if(!words.length) return training();
    const n=Math.min(10, src==='miss'?words.length:10);
    TR={src,order:sh(words).slice(0,n),i:0,n,score:0,wrong:[]};
    trNext();
}
function trNext(){
    if(!TR) return;
    if(TR.i>=TR.n) return trEnd();
    const w=TR.order[TR.i], q=makeQ(w,null,floorWords(WI[w].f));
    TR.q=q;
    ovl(`<div class="paper-box quiz-box">
      <div class="trtop"><span>🏛️ ${TR.src==='miss'?'ทบทวนคำที่เคยผิด':'ฝึกชั้น '+(TR.src+1)}</span><span>ข้อ ${TR.i+1}/${TR.n} · ✅ ${TR.score}</span></div>
      <div class="trprog"><div style="width:${TR.i/TR.n*100}%"></div></div>
      ${quizBody(q)}
      <button class="skipbtn" onclick="trQuit()">✕ ออกจากการฝึก</button>
    </div>`);
    if(q.mode!=='blank') setTimeout(()=>speakWord(q.key),150);
    document.querySelectorAll('.qopt').forEach(c=>c.onclick=()=>trAns(c.dataset.o));
}
function trAns(o){
    if(!TR||!TR.q) return;
    const q=TR.q; TR.q=null;
    const ok=o===q.a;
    if(ok){TR.score++;SFX.ok()}else{SFX.bad();TR.wrong.push(q.mode==='anto'?q.a:q.key)}
    noteResult(q,ok);
    markOpts(q,o);
    speakWord(q.mode==='anto'?q.a:q.key);
    const sb=$('.quiz-box .skipbtn'); if(sb) sb.remove();
    $('.quiz-box').insertAdjacentHTML('beforeend',`<div class="rv-box">${reviewHTML(q,o,ok?'ok':'wrong')}</div><button class="btn gobtn" id="nx">${TR.i+1>=TR.n?'ดูผลการฝึก ➔':'ข้อต่อไป ➔'}</button>`);
    $('#nx').onclick=()=>{TR.i++;trNext()};
    setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60);
}
function trQuit(){TR=null;training()}
function trEnd(){
    const {score,n,src,wrong}=TR;
    const pass=score>=Math.ceil(n*0.7);
    let gain=0;
    if(pass&&n>=5&&BANK<9){BANK++;gain=1}
    if(src!=='miss') TR_BEST[src]=Math.max(TR_BEST[src]||0,score);
    saveProgress();
    pass?SFX.win():SFX.lose();
    const stars=score===n?'⭐⭐⭐':pass?'⭐⭐':score>=n/2?'⭐':'';
    ovl(`<div class="paper-box" style="max-width:420px;text-align:center;gap:8px">
      <div style="font-size:40px">${pass?'🏆':'📚'}</div>
      <h2 class="ptitle" style="margin:0">${pass?'ฝึกสำเร็จ!':'ฝึกต่ออีกนิดนะ!'}</h2>
      <div style="font-size:30px;font-weight:900;color:#3a2a10">${score}/${n} <span style="font-size:22px">${stars}</span></div>
      ${gain?`<div class="bankrow">💎 ได้รับคริสตัล +1 (สะสม ${BANK}/9)</div>`:(pass&&n<5?`<div style="font-size:12px;color:#6a5238">ต้องฝึกอย่างน้อย 5 ข้อถึงจะได้คริสตัล</div>`:'')}
      ${wrong.length?`<div class="rv-box" style="text-align:left"><b>คำที่ควรทบทวน:</b><div class="chips">${[...new Set(wrong)].map(w=>`<span class="chip" onclick="speakWord('${w}')">🔊 ${w} <small class="nt">${TH[w]}</small></span>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:6px">
        <button class="btn paper-card" style="flex:1" onclick="trStart(${src==='miss'?"'miss'":src})">🔁 ฝึกอีกรอบ</button>
        <button class="btn paper-card" style="flex:1" onclick="training()">🏛️ ลานฝึก</button>
      </div>
      <button class="btn paper-card" onclick="gotoMenu()">← กลับเมนูหลัก</button>
    </div>`);
    TR=null;
}

function setBossBg(i){let e=$('#bossbg');if(!e){$('#f').insertAdjacentHTML('afterbegin','<div id="bossbg"></div>');e=$('#bossbg')}e.style.backgroundImage=i>=0&&FLOOR_IMGS[i]?`url("${encodeURI(FLOOR_IMGS[i])}")`:'none';e.classList.toggle('on',i>=0)}
function enBar(v,need){return `<span class="enbar">${Array.from({length:EN_MAX},(_,i)=>`<i class="${i<v?'on':''} ${need&&i===need-1?'mk':''}"></i>`).join('')}</span>`}
function toggleMute(){mute=!mute;const b=$('#mt');if(b)b.textContent=mute?'🔇':'🔊';if(mute){const w=bgmWant;bgmStop();bgmWant=w;try{speechSynthesis.cancel()}catch(e){}}else if(bgmWant)bgmPlay()}
function stopTimers(){['skillTimerInterval','spTimerInterval'].forEach(k=>{if(G[k]){clearInterval(G[k]);G[k]=null}})}
function showConfirm(){$('#cf').style.display='flex'}
function closeConfirm(x){$('#cf').style.display='none';if(x)gotoMenu()}
gotoMenu();
</script></body></html>
